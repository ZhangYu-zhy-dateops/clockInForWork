<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>功能选择</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui, -apple-system, sans-serif;
}
body{
    background:#f7f8fa;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:#333;
}
.card{
    background:#ffffff;
    width:100%;
    max-width:420px;
    padding:36px 28px;
    border-radius:16px;
    box-shadow:0 2px 12px rgba(0,0,0,0.08);
    text-align:center;
}
.title{
    font-size:24px;
    font-weight:600;
    margin-bottom:24px;
}
.btn-modal{
    width:100%;
    padding:13px 0;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    margin-bottom:14px;
}
.btn-modal:active{
    background:#1d4ed8;
}
.btn-back{
    width:100%;
    padding:10px 0;
    border:1px solid #d1d5db;
    border-radius:10px;
    background:#fff;
    font-size:15px;
    color:#333;
}
.btn-back:active{
    background:#f3f4f6;
}
</style>
</head>
<body>
<div class="card">
    <div class="title">请选择功能</div>
    <button class="btn-modal" onclick="location.href='/'">进入打卡页</button>
    <button class="btn-modal" onclick="location.href='/staff'">员工管理</button>
    <button class="btn-modal" onclick="location.href='/all_record'">全部打卡记录</button>
    <button class="btn-modal" onclick="location.href='/change_pwd'">修改管理员密码</button>
    <button class="btn-back" onclick="location.href='/logout'">退出登录</button>
</div>
</body>
</html>
